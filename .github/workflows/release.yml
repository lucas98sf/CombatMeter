name: Release to Thunderstore

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy or retry
        required: true
        type: string

permissions:
  contents: read

# Never overlap uploads, including distinct versions. Failed runs may be rerun.
concurrency:
  group: thunderstore-publish
  cancel-in-progress: false

jobs:
  policy:
    runs-on: windows-latest
    outputs:
      deploy: ${{ steps.policy.outputs.deploy }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false
      - id: policy
        name: Only published non-prerelease versions deploy
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/release-policy.ps1
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release) { throw 'Release must already exist.' }
          if ($release.isDraft) { throw 'Draft releases cannot deploy.' }
          $decision = Get-ReleasePolicy -Tag $release.tagName -Prerelease $release.isPrerelease
          "deploy=$($decision.Deploy.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$($decision.Version)" >> $env:GITHUB_OUTPUT
          $decision.Reason >> $env:GITHUB_STEP_SUMMARY

  publish:
    needs: policy
    if: needs.policy.outputs.deploy == 'true'
    environment: THUNDERSTORE_TOKEN
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test policy and game-independent code
        shell: pwsh
        run: |
          ./scripts/test-release-policy.ps1
          dotnet test tests/CombatMeter.Tests/CombatMeter.Tests.csproj --configuration Release --logger trx
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Download and verify the locally built release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          RELEASE_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/release --pattern "CombatMeter-Thunderstore-$env:RELEASE_VERSION.zip" --pattern "CombatMeter-Build-$env:RELEASE_VERSION.json"
          if ($LASTEXITCODE -ne 0) { throw 'Missing release ZIP or build record. Prepare releases with scripts/release.ps1.' }
          ./scripts/verify-release-package.ps1 -Version $env:RELEASE_VERSION -AssetDirectory artifacts/release
      - name: Install pinned official Thunderstore CLI
        shell: pwsh
        run: |
          dotnet tool install tcli --version 0.2.4 --tool-path .tools/tcli
          if ($LASTEXITCODE -ne 0) { throw 'TCLI installation failed.' }
      - name: Publish BiribaMods-CombatMeter
        shell: pwsh
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
          RELEASE_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          if (!$env:TCLI_AUTH_TOKEN) { throw 'Set the repository Actions secret THUNDERSTORE_TOKEN to a BiribaMods Thunderstore service-account token.' }
          $existing = $null
          $expectedUrl = "https://thunderstore.io/package/download/BiribaMods/CombatMeter/$env:RELEASE_VERSION/"
          try { Invoke-WebRequest $expectedUrl -OutFile artifacts/release/published.zip; $existing = $true }
          catch { if ([int]$_.Exception.Response.StatusCode -ne 404) { throw } }
          $zip = "artifacts/release/CombatMeter-Thunderstore-$env:RELEASE_VERSION.zip"
          if ($existing) {
            # A retry is successful only if the published bytes are this exact artifact.
            if ((Get-FileHash $zip).Hash -ne (Get-FileHash artifacts/release/published.zip).Hash) { throw 'This version already exists with different bytes. Publish a new version.' }
            'Identical version already published; upload skipped.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            $package = Invoke-RestMethod 'https://thunderstore.io/api/experimental/package/BiribaMods/CombatMeter/'
            if ([version]$env:RELEASE_VERSION -le [version]$package.latest.version_number) { throw 'Release must be newer than the latest Thunderstore version.' }
            ./.tools/tcli/tcli.exe publish --config-path thunderstore.toml --file $zip
            if ($LASTEXITCODE -ne 0) { throw 'Thunderstore publication failed.' }
            for ($attempt = 0; ; $attempt++) {
              try { Invoke-WebRequest $expectedUrl -OutFile artifacts/release/published.zip; break }
              catch {
                if ($attempt -ge 7 -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
                Start-Sleep -Seconds 3
              }
            }
            if ((Get-FileHash $zip).Hash -ne (Get-FileHash artifacts/release/published.zip).Hash) { throw 'Published package bytes do not match the verified release artifact.' }
            "Published CombatMeter $env:RELEASE_VERSION to https://thunderstore.io/c/v-rising/p/BiribaMods/CombatMeter/" >> $env:GITHUB_STEP_SUMMARY
          }
