name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Test deployment policy
        shell: pwsh
        run: ./scripts/test-release-policy.ps1
      - name: Test game-independent code
        shell: pwsh
        run: dotnet test tests/CombatMeter.Tests/CombatMeter.Tests.csproj --configuration Release --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
