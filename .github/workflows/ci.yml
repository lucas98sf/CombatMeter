name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test deployment policy
        shell: pwsh
        run: ./scripts/test-release-policy.ps1
      - name: Test game-independent code
        shell: pwsh
        run: dotnet test tests/CombatMeter.Tests/CombatMeter.Tests.csproj --configuration Release --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
